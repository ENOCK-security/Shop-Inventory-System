
spring.application.name=ShopInventorySystem

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/shop_inventory}
spring.datasource.username=${DB_USERNAME:shop_app}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
# Simulated payments must be explicitly enabled.
app.payment-simulation.enabled=${PAYMENT_SIMULATION_ENABLED:false}
# Admin API credentials must be supplied through environment variables.
app.security.admin.username=${ADMIN_USERNAME}
app.security.admin.password=${ADMIN_PASSWORD}
